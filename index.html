<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>툭 개인정보 처리방침</title>
  <style>
    :root { --bg: #F3F3F0; --text: #161B1B; --sub: #646B6A; --accent: #2B8183; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0B0F0F; --text: #EEF2F1; --sub: #97A3A1; --accent: #4FB3AE; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.4px; }
    .meta { color: var(--sub); font-size: 14px; margin-bottom: 32px; }
    h2 { font-size: 19px; margin: 32px 0 8px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>툭 개인정보 처리방침</h1>
    <p class="meta">Tuk Privacy Policy · 시행일 <!-- 시행일 --></p>

    <!-- 처리방침 본문 자리: 받은 글을 여기에 넣는다(제목은 h2, 문단은 p). -->
    <p>준비 중이에요.</p>
  </main>
</body>
</html>
